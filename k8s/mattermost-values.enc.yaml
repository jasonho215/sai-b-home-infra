    MM_EMAILSETTINGS_FEEDBACKNAME: cowzaap
    MM_EMAILSETTINGS_FEEDBACKEMAIL: mattermost@cowzaap.dev
    MM_EMAILSETTINGS_REPLYTOADDRESS: mattermost@cowzaap.dev
service:
    type: ClusterIP
ingress:
    enabled: false
persistence:
    data:
        enabled: true
        size: 30Gi
        storageClass: oci-bv-lower-cost
        accessMode: ReadWriteOnce
    plugins:
        enabled: true
        size: 1Gi
        storageClass: oci-bv-lower-cost
        accessMode: ReadWriteOnce
resources:
    requests:
        cpu: 100m
        memory: 1Gi
    limits:
        memory: 2Gi
securityContext:
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
