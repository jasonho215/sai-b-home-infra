# Values for the official chart mattermost/mattermost-team-edition.
# Install the local k8s/platform chart first. It provides Postgres, the
# storage class, and cloudflared. This chart's bundled database is MySQL.
# The database connection string is encrypted in mattermost-values.enc.yaml.
# make decrypt-all writes this plaintext file for helm.
image:
    repository: docker.io/mattermost/mattermost-team-edition
    tag: 12.0.2
    imagePullPolicy: IfNotPresent
mysql:
    enabled: false
externalDB:
    enabled: true
    externalDriverType: postgres
    externalConnectionString: ENC[AES256_GCM,data:VYpL6Eusy8pePfN0ntAp9YQxkQzI82+04fxN4PkTZRLPwkP7j9LuuHGy0wZ87WVaG6eZTUHaWIG0UfiNQ9RhYSKk+l0ojDPPIUWE9Tjq029qTPdy+BC6bLbEEvAEwIuwG2MZgUyt7TDOthnMsNBm8QCo5Q+9u3sk/tj1jrXQ,iv:fGYcRDlSDVLt7Onvst5lUWYS/tADBSJP1Ybyf6wnR+g=,tag:uSeIcVjKafOKFfSkzmIR5Q==,type:str]
config:
    MM_SERVICESETTINGS_SITEURL: https://mattermost.cowzaap.dev
    MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "true"
    MM_EMAILSETTINGS_ENABLESMTPAUTH: "true"
    MM_EMAILSETTINGS_SMTPSERVER: smtp.mx.cloudflare.net
    MM_EMAILSETTINGS_SMTPPORT: "465"
    MM_EMAILSETTINGS_CONNECTIONSECURITY: TLS
    MM_EMAILSETTINGS_SMTPUSERNAME: api_token
