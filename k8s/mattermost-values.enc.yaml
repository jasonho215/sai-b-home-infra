service:
    type: ClusterIP
ingress:
    enabled: false
persistence:
    data:
        enabled: true
        size: 30Gi
        storageClass: oci-bv-lower-cost
        accessMode: ReadWriteOnce
    plugins:
        enabled: true
        size: 1Gi
        storageClass: oci-bv-lower-cost
        accessMode: ReadWriteOnce
resources:
